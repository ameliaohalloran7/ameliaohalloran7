<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog – Amelia O'Halloran</title>
  <style>
    html {
      overflow-y: scroll;
    }

    body {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      background-color: #D5E4F9;
      display: block;
      flex-direction: column;
      min-height: 100vh;
      align-items: flex-start;
      justify-content: center;
    }

    .container {
      display: flex;
      width: 100%;
      align-items: stretch;
      margin-top: 5vh;
    }

    .sidebar {
      width: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      margin-left: 80px;
      flex-shrink: 0;
      justify-content: flex-start;
      position: sticky;
      top: 5vh;
      height: auto;
      margin-bottom: 5vh;
    }

    .sidebar img {
      width: 140px;
      object-fit: cover;
      margin-bottom: 1.25rem;
      border: none;
    }

    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      text-align: center;
    }

    .nav-link {
      display: block;
      background-color: transparent;
      font-family: inherit;
      font-size: 1rem;
      color: inherit;
      cursor: pointer;
      padding: 0.5rem 1rem;
      width: 100%;
      max-width: 160px;
      margin: 0 auto;
      text-align: center;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .nav-link:hover {
      color: #8B4513;
      transform: translateY(-2px);
      text-decoration: none;
    }

    .nav-link.active {
      color: #8B4513;
    }

    main {
      width: 650px;
      max-width: 650px;
      line-height: 1.6;
      padding: 1.8rem 2rem 0.5rem 2rem;
      overflow: visible;
      margin-left: 100px;
      margin-bottom: 5vh;
      min-height: 100%;
    }

    h1, h2, h3 {
      font-weight: normal;
    }

    .post-item {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #0a1a3c33;
    }

    .post-item:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    .post-item h3 {
      margin-bottom: 0.25rem;
      font-size: 1.2rem;
    }

    .post-item h3 a {
      color: inherit;
      text-decoration: none;
    }

    .post-item h3 a:hover {
      color: #8B4513;
      text-decoration: underline;
    }

    .post-item h4 {
      margin: 0 0 0.4rem 0;
      font-size: 1rem;
      font-style: italic;
      font-weight: normal;
      opacity: 0.8;
    }

    .post-date {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.65;
    }

    a {
      color: #8B4513;
      text-decoration: none;
    }

    a:hover {
      color: #5C2E0C;
      text-decoration: underline;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .bottom-photo {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 2rem auto 1rem auto;
    }

    @media (max-width: 800px) {
      body {
        flex-direction: column;
        justify-content: flex-start;
      }

      .container {
        flex-direction: column;
        margin-top: 0;
      }

      .sidebar {
        width: 100%;
        height: auto;
        flex-direction: row;
        justify-content: center;
        margin-left: 0;
        padding: 1rem;
        position: static;
      }

      main {
        width: 90%;
        max-width: 90%;
        margin: 1rem auto;
        padding: 2rem 1rem;
        height: auto;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <a href="/"><img src="/photo.jpg" alt="Amelia O'Halloran"></a>
      <nav id="site-nav"></nav>
    </aside>

    <main>
      <h2>Blog</h2>

      <!-- Add new posts here, most recent first. Copy the block below. -->
      <div class="post-item">
        <h3><a href="/blog/2/">Consequences of the Bettman Playoff Format</a></h3>
        <h4>Who is most likely to sue Gary Bettman for the playoff format he imposed in 2013-14?</h4>
        <p class="post-date">June 9, 2026</p>
      </div>

      <div class="post-item">
        <h3><a href="/blog/1/">Within-Team Pay Inequality Comparisons: PWHL versus NHL</a></h3>
        <h4>Calculating Gini Coefficients of Income Inequality for each PWHL and NHL team</h4>
        <p class="post-date">May 26, 2026</p>
      </div>

      <footer></footer>
    </main>
  </div>

  <script src="/nav.js"></script>
  <img src="/IMG_7152.jpg" alt="Decorative bottom photo" class="bottom-photo">
</body>
</html>
