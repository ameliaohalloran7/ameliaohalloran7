<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where Is Your Neighborhood? — Amelia O'Halloran</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.draw -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- Leaflet.heat -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Courier New", Courier, monospace;
      background-color: #D5E4F9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    a { color: #8B4513; text-decoration: none; }
    a:hover { color: #5C2E0C; text-decoration: underline; }

    /* -----------------------------------------------------------------------
       Header
    ----------------------------------------------------------------------- */
    #page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 48px;
      background-color: #D5E4F9;
      border-bottom: 2px solid rgba(10, 26, 60, 0.2);
      flex-shrink: 0;
      gap: 12px;
    }

    #header-title {
      font-size: 0.95rem;
      color: #0a1a3c;
      font-weight: normal;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      font-size: 0.85rem;
    }

    #submission-count {
      color: #0a1a3c;
      opacity: 0.65;
      white-space: nowrap;
    }

    /* -----------------------------------------------------------------------
       Draw action bar
    ----------------------------------------------------------------------- */
    #draw-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      background-color: rgba(10, 26, 60, 0.04);
      border-bottom: 1px solid rgba(10, 26, 60, 0.12);
      flex-shrink: 0;
      gap: 12px;
    }

    #btn-draw {
      font-family: "Courier New", Courier, monospace;
      font-size: 1rem;
      font-weight: bold;
      padding: 11px 36px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #0a1a3c;
      color: #D5E4F9;
      letter-spacing: 0.02em;
      transition: background-color 0.2s, transform 0.15s;
    }

    #btn-draw:hover  { background-color: #162d6a; transform: translateY(-1px); }
    #btn-draw:active { transform: translateY(0); }

    #btn-draw.drawing {
      background-color: #6b2e0a;
      color: #fff;
    }

    #btn-draw.drawing:hover { background-color: #8B4513; }

    #draw-hint {
      font-size: 0.8rem;
      color: #0a1a3c;
      opacity: 0.6;
    }

    #draw-hint.hidden { display: none; }

    /* -----------------------------------------------------------------------
       Map
    ----------------------------------------------------------------------- */
    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    /* Hide the default Leaflet.draw toolbar — we drive it programmatically */
    .leaflet-draw { display: none !important; }

    /* -----------------------------------------------------------------------
       Slide-up submission form
    ----------------------------------------------------------------------- */
    #form-panel {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      background: #faf8f4;
      border-radius: 14px 14px 0 0;
      border-top: 2px solid rgba(10, 26, 60, 0.15);
      box-shadow: 0 -4px 24px rgba(10, 26, 60, 0.12);
      z-index: 2000;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #form-panel.hidden {
      transform: translateX(-50%) translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    #form-inner {
      padding: 22px 24px 26px;
    }

    #form-inner h2 {
      font-size: 1rem;
      font-weight: normal;
      color: #0a1a3c;
      margin-bottom: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: 0.8rem;
      color: #0a1a3c;
      opacity: 0.75;
    }

    .field input[type="text"],
    .field input[type="tel"] {
      border: 1px solid rgba(10, 26, 60, 0.3);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-family: "Courier New", Courier, monospace;
      background: white;
      outline: none;
      color: #0a1a3c;
      transition: border-color 0.2s;
    }

    .field input[type="text"]:focus,
    .field input[type="tel"]:focus { border-color: #8B4513; }

    .optional {
      font-style: italic;
      opacity: 0.65;
      font-weight: normal;
    }

    /* Payment method row */
    #payment-row {
      margin-top: 8px;
      padding: 10px 12px;
      background: rgba(10, 26, 60, 0.04);
      border-radius: 6px;
      border: 1px solid rgba(10, 26, 60, 0.1);
    }

    #payment-row p {
      font-size: 0.8rem;
      color: #0a1a3c;
      margin-bottom: 8px;
    }

    .radio-options {
      display: flex;
      gap: 20px;
    }

    .radio-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      color: #0a1a3c;
      cursor: pointer;
      opacity: 1;
    }

    .radio-options input[type="radio"] {
      accent-color: #8B4513;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    #form-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    #form-status {
      margin-top: 10px;
      font-size: 0.82rem;
      min-height: 18px;
    }

    #form-status.error   { color: #8B0000; }
    #form-status.success { color: #2e5e2e; }

    /* -----------------------------------------------------------------------
       Buttons
    ----------------------------------------------------------------------- */
    .btn-primary, .btn-secondary {
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 0.88rem;
      font-family: "Courier New", Courier, monospace;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: #0a1a3c;
      color: #D5E4F9;
      flex: 1;
    }

    .btn-primary:hover  { background-color: #162d6a; }
    .btn-primary:active { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      background-color: transparent;
      color: #8B4513;
      border: 1px solid rgba(139, 69, 19, 0.35);
    }

    .btn-secondary:hover { color: #5C2E0C; border-color: #5C2E0C; transform: translateY(-1px); }

    #btn-overlay.active {
      color: #5C2E0C;
      border-color: #5C2E0C;
      text-decoration: underline;
    }

    .hidden { display: none !important; }

    /* -----------------------------------------------------------------------
       City picker modal
    ----------------------------------------------------------------------- */
    #city-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 26, 60, 0.55);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #city-modal {
      background: #faf8f4;
      border-radius: 14px;
      padding: 36px 32px 32px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 8px 40px rgba(10, 26, 60, 0.22);
      text-align: center;
    }

    #city-modal h2 {
      font-size: 1.1rem;
      font-weight: normal;
      color: #0a1a3c;
      margin-bottom: 8px;
    }

    #city-modal p {
      font-size: 0.82rem;
      color: #0a1a3c;
      opacity: 0.65;
      margin-bottom: 24px;
    }

    .city-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .city-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      padding: 12px 20px;
      border: 1px solid rgba(10, 26, 60, 0.25);
      border-radius: 8px;
      background: white;
      color: #0a1a3c;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .city-btn:hover {
      background: #D5E4F9;
      border-color: #0a1a3c;
      transform: translateY(-1px);
    }

    .city-btn:active { transform: translateY(0); }

    @media (max-width: 500px) {
      #form-panel   { max-width: 100%; }
      #header-title { font-size: 0.82rem; }
      #btn-draw     { font-size: 0.92rem; padding: 10px 24px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="page-header">
    <div id="header-title">
      <strong>Where Is Your Neighborhood?</strong>
    </div>
    <div id="header-right">
      <button id="btn-overlay" class="btn-secondary">Show all submissions</button>
      <span id="submission-count"></span>
      <a href="https://ameliaohalloran.com" title="Back to main site">← ameliaohalloran.com</a>
    </div>
  </header>

  <!-- Draw action bar -->
  <div id="draw-bar">
    <button id="btn-draw">Begin Drawing</button>
    <span id="draw-hint">Click on the map to place points &mdash; click the first point to finish</span>
  </div>

  <!-- City picker modal -->
  <div id="city-modal-backdrop">
    <div id="city-modal">
      <h2>Which city do you live in?</h2>
      <p>This study is currently collecting data for three cities.</p>
      <div class="city-btn-group">
        <button class="city-btn" data-city="Boston" data-lat="42.3601" data-lon="-71.0589" data-zoom="13">Boston, MA</button>
        <button class="city-btn" data-city="Chicago" data-lat="41.8781" data-lon="-87.6298" data-zoom="12">Chicago, IL</button>
        <button class="city-btn" data-city="New York City" data-lat="40.7128" data-lon="-74.0060" data-zoom="12">New York City, NY</button>
      </div>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Submission form -->
  <div id="form-panel" class="hidden">
    <div id="form-inner">
      <h2>Name your neighborhood</h2>
      <div class="field">
        <label for="input-name">Neighborhood name</label>
        <input id="input-name" type="text" placeholder="e.g. Capitol Hill" maxlength="100" autocomplete="off" />
      </div>
      <input id="input-city" type="hidden" maxlength="100" />
      <div class="field">
        <label for="input-phone">Phone number <span class="optional">(optional - for payment)</span></label>
        <input id="input-phone" type="tel" placeholder="e.g. 555-867-5309" maxlength="20" autocomplete="tel" />
        <div id="payment-row" class="hidden">
          <p>Receive $0 via:</p>
          <div class="radio-options">
            <label><input type="radio" name="payment" value="venmo" /> Venmo</label>
            <label><input type="radio" name="payment" value="zelle" /> Zelle</label>
          </div>
        </div>
      </div>
      <div id="form-actions">
        <button id="btn-cancel" class="btn-secondary">Redraw</button>
        <button id="btn-submit" class="btn-primary">Submit</button>
      </div>
      <div id="form-status"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://neighborhood-mapping-app.onrender.com";

    // -------------------------------------------------------------------------
    // State
    // -------------------------------------------------------------------------
    let pendingGeometry = null;
    let drawnLayer      = null;
    let polygonDrawer   = null;
    let heatLayer       = null;
    let polyOverlay     = null;
    let overlayVisible  = false;
    let selectedCity    = null;

    // -------------------------------------------------------------------------
    // DOM refs
    // -------------------------------------------------------------------------
    const formPanel        = document.getElementById("form-panel");
    const inputName        = document.getElementById("input-name");
    const inputCity        = document.getElementById("input-city");
    const inputPhone       = document.getElementById("input-phone");
    const paymentRow       = document.getElementById("payment-row");
    const btnSubmit        = document.getElementById("btn-submit");
    const btnCancel        = document.getElementById("btn-cancel");
    const btnOverlay       = document.getElementById("btn-overlay");
    const btnDraw          = document.getElementById("btn-draw");
    const drawHint         = document.getElementById("draw-hint");
    const formStatus       = document.getElementById("form-status");
    const countEl          = document.getElementById("submission-count");
    const cityModalBackdrop = document.getElementById("city-modal-backdrop");

    // -------------------------------------------------------------------------
    // Map — start with a neutral US view; city picker will set the real view
    // -------------------------------------------------------------------------
    const map = L.map("map", { zoomControl: true });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
    }).addTo(map);

    map.setView([39.5, -98.35], 4);

    // -------------------------------------------------------------------------
    // City picker modal
    // -------------------------------------------------------------------------
    document.querySelectorAll(".city-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedCity = btn.dataset.city;
        const lat    = parseFloat(btn.dataset.lat);
        const lon    = parseFloat(btn.dataset.lon);
        const zoom   = parseInt(btn.dataset.zoom, 10);
        map.setView([lat, lon], zoom);
        inputCity.value = selectedCity;
        cityModalBackdrop.style.display = "none";
      });
    });

    // -------------------------------------------------------------------------
    // Draw setup (toolbar hidden via CSS; driven programmatically)
    // -------------------------------------------------------------------------
    const drawnItems = new L.FeatureGroup().addTo(map);

    const drawControl = new L.Control.Draw({
      draw: {
        polygon:      { shapeOptions: { color: "#0a1a3c", fillOpacity: 0.12, weight: 2 } },
        polyline:     false,
        rectangle:    false,
        circle:       false,
        marker:       false,
        circlemarker: false,
      },
      edit: { featureGroup: drawnItems, remove: false },
    });
    map.addControl(drawControl);

    const POLYGON_OPTIONS = { shapeOptions: { color: "#0a1a3c", fillOpacity: 0.12, weight: 2 } };

    function startDrawing() {
      clearDrawing();
      polygonDrawer = new L.Draw.Polygon(map, POLYGON_OPTIONS);
      polygonDrawer.enable();
      btnDraw.textContent = "Cancel Drawing";
      btnDraw.classList.add("drawing");
      drawHint.classList.remove("hidden");
    }

    function stopDrawing() {
      if (polygonDrawer) { polygonDrawer.disable(); polygonDrawer = null; }
      btnDraw.textContent = "Begin Drawing";
      btnDraw.classList.remove("drawing");
      drawHint.classList.add("hidden");
    }

    btnDraw.addEventListener("click", () => {
      if (btnDraw.classList.contains("drawing")) {
        stopDrawing();
      } else {
        startDrawing();
      }
    });

    // Hide hint initially
    drawHint.classList.add("hidden");

    map.on(L.Draw.Event.CREATED, (e) => {
      drawnLayer = e.layer;
      drawnItems.addLayer(drawnLayer);
      pendingGeometry = drawnLayer.toGeoJSON().geometry;
      polygonDrawer = null;
      btnDraw.textContent = "Begin Drawing";
      btnDraw.classList.remove("drawing");
      drawHint.classList.add("hidden");
      showForm();
    });

    // -------------------------------------------------------------------------
    // Phone → show/hide payment row
    // -------------------------------------------------------------------------
    inputPhone.addEventListener("input", () => {
      if (inputPhone.value.trim().length > 0) {
        paymentRow.classList.remove("hidden");
      } else {
        paymentRow.classList.add("hidden");
        document.querySelectorAll("input[name='payment']").forEach(r => r.checked = false);
      }
    });

    // -------------------------------------------------------------------------
    // Form helpers
    // -------------------------------------------------------------------------
    function showForm() {
      formPanel.classList.remove("hidden");
      inputName.focus();
      setStatus("", "");
    }

    function hideForm() {
      formPanel.classList.add("hidden");
      inputName.value  = "";
      inputPhone.value = "";
      paymentRow.classList.add("hidden");
      document.querySelectorAll("input[name='payment']").forEach(r => r.checked = false);
      btnCancel.textContent = "Redraw";
      btnSubmit.disabled = false;
      setStatus("", "");
    }

    function clearDrawing() {
      if (drawnLayer) { drawnItems.removeLayer(drawnLayer); drawnLayer = null; }
      pendingGeometry = null;
    }

    function setStatus(msg, type) {
      formStatus.textContent = msg;
      formStatus.className   = type;
    }

    btnCancel.addEventListener("click", () => {
      clearDrawing();
      hideForm();
    });

    // -------------------------------------------------------------------------
    // Submit
    // -------------------------------------------------------------------------
    btnSubmit.addEventListener("click", async () => {
      const name          = inputName.value.trim();
      const city          = inputCity.value.trim();
      const phone         = inputPhone.value.trim();
      const paymentRadio  = document.querySelector("input[name='payment']:checked");
      const payment       = paymentRadio ? paymentRadio.value : null;

      if (!name) { setStatus("Please enter a neighborhood name.", "error"); return; }
      if (!city) { setStatus("Please enter a city.", "error"); return; }
      if (!pendingGeometry) { setStatus("No polygon drawn — please draw your neighborhood first.", "error"); return; }

      btnSubmit.disabled = true;
      setStatus("Saving…", "");

      try {
        const res = await fetch(`${API_URL}/api/submit`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({
            geometry:          pendingGeometry,
            neighborhood_name: name,
            city,
            phone:             phone || null,
            payment_method:    phone ? payment : null,
          }),
        });
        const data = await res.json();

        if (res.ok) {
          setStatus("Submitted — thank you!", "success");
          btnCancel.textContent = "Draw another";
          fetchCount();
          if (overlayVisible) loadOverlay();
        } else {
          setStatus(data.error || "Submission failed — please try again.", "error");
          btnSubmit.disabled = false;
        }
      } catch {
        setStatus("Network error — please check your connection and try again.", "error");
        btnSubmit.disabled = false;
      }
    });

    [inputName, inputPhone].forEach((el) => {
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") btnSubmit.click(); });
    });

    // -------------------------------------------------------------------------
    // Overlay
    // -------------------------------------------------------------------------
    btnOverlay.addEventListener("click", async () => {
      overlayVisible = !overlayVisible;
      if (overlayVisible) {
        btnOverlay.classList.add("active");
        btnOverlay.textContent = "Hide submissions";
        await loadOverlay();
      } else {
        btnOverlay.classList.remove("active");
        btnOverlay.textContent = "Show all submissions";
        removeOverlay();
      }
    });

    async function loadOverlay() {
      removeOverlay();
      let fc;
      try {
        const res = await fetch(`${API_URL}/api/submissions`);
        fc = await res.json();
      } catch { return; }

      if (!fc.features || fc.features.length === 0) return;

      polyOverlay = L.geoJSON(fc, {
        style: {
          color:       "#8B4513",
          weight:      1.5,
          opacity:     0.5,
          fillColor:   "#8B4513",
          fillOpacity: 0.06,
        },
      }).addTo(map);

      const points = fc.features
        .map((f) => centroid(f.geometry))
        .filter(Boolean)
        .map(([lon, lat]) => [lat, lon, 1]);

      if (points.length > 0) {
        heatLayer = L.heatLayer(points, { radius: 30, blur: 22, maxZoom: 17 }).addTo(map);
      }
    }

    function removeOverlay() {
      if (polyOverlay) { map.removeLayer(polyOverlay); polyOverlay = null; }
      if (heatLayer)   { map.removeLayer(heatLayer);   heatLayer   = null; }
    }

    function centroid(geometry) {
      if (!geometry || geometry.type !== "Polygon") return null;
      const ring = geometry.coordinates[0];
      if (!ring || ring.length === 0) return null;
      let sumLon = 0, sumLat = 0;
      for (const [lon, lat] of ring) { sumLon += lon; sumLat += lat; }
      return [sumLon / ring.length, sumLat / ring.length];
    }

    // -------------------------------------------------------------------------
    // Count badge
    // -------------------------------------------------------------------------
    async function fetchCount() {
      try {
        const res  = await fetch(`${API_URL}/api/count`);
        const data = await res.json();
        countEl.textContent = data.count === 1
          ? "1 submission"
          : `${data.count.toLocaleString()} submissions`;
      } catch { /* non-critical */ }
    }

    fetchCount();
  </script>
</body>
</html>
